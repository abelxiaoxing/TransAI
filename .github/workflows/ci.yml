name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgl1-mesa-dev \
            libxkbcommon-dev libdbus-1-dev libsecret-1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          # Explicit archive list: qtbase covers Core/Network/DBus/Test,
          # qtdeclarative covers Quick/QML, icu holds the bundled
          # libicui18n/libicuuc/libicudata that the prebuilt Qt binaries link
          # against (Ubuntu 24.04 ships ICU 74, Qt 6.9 wants .73).
          archives: qtbase qtdeclarative icu

      - name: Configure & build
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Headless smoke: the first instance stays resident holding the
      # single-instance socket, the second forwards --translate-selection and
      # exits. Under offscreen the GlobalShortcutManager refuses registration
      # by design (logged, not fatal). QT_FORCE_STDERR_LOGGING keeps qDebug on
      # stderr so failures are visible in the Actions log.
      - name: Headless smoke test
        run: |
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_FORCE_STDERR_LOGGING=1
          # If the first instance died before creating the command socket, the
          # second would become the server itself and block forever — the
          # timeouts turn that into a fast, visible step failure instead.
          timeout 30 ./build/TransAI --background &
          APP_PID=$!
          sleep 5
          timeout 15 ./build/TransAI --translate-selection
          kill $APP_PID

  # Cross-platform coverage: build + unit tests only (no GUI smoke on
  # headless runners). Both jobs are blocking gate failures, like linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          arch: win64_mingw
          cache: true
          archives: qtbase qtdeclarative
          # Qt's prebuilt MinGW archives need the *matching* toolchain: the
          # runner's system gcc disagrees with them on how `__argc` is
          # declared, which surfaces as an undefined `__imp___argc` at link
          # time (Qt6EntryPoint references the dllimport flavour).
          tools: 'tools_mingw1310'

      - name: Prefer Qt's matching MinGW toolchain
        shell: pwsh
        run: |
          $qtRoot = Split-Path (Split-Path $env:QT_ROOT_DIR)
          $mingw = Join-Path $qtRoot 'Tools\mingw1310_64\bin'
          if (Test-Path $mingw) {
            $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Using Qt MinGW toolchain: $mingw"
          } else {
            Write-Host "::warning::Qt MinGW toolchain not found at $mingw; using the system compiler"
          }
          gcc --version
          Write-Host "which gcc: $((Get-Command gcc).Source)"

      - name: Configure & build
        run: |
          cmake -B build -G "MinGW Makefiles" -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          archives: qtbase qtdeclarative

      - name: Configure, build & test
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
          ctest --test-dir build --output-on-failure
