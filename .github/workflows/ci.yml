name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Manual only: the Windows packaging scripts are not part of the normal build
  # path, so nothing exercised their fail-fast OCR check until now.
  workflow_dispatch:

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgl1-mesa-dev \
            libxkbcommon-dev libdbus-1-dev libsecret-1-dev p7zip-full

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          # Explicit archive list: qtbase covers Core/Network/DBus/Test,
          # qtdeclarative covers Quick/QML, icu holds the bundled
          # libicui18n/libicuuc/libicudata that the prebuilt Qt binaries link
          # against (Ubuntu 24.04 ships ICU 74, Qt 6.9 wants .73).
          archives: qtbase qtdeclarative icu

      # The bundled OCR backend needs its PP-OCR weights; they are not in git
      # (13 MB of binaries). Without them the end-to-end OCR test skips itself.
      - name: Fetch bundled OCR models
        run: ./scripts/fetch_ocr_models.sh

      # A syntax error in these would only surface for whoever runs them by
      # hand (install / model fetch), so parse them here: ~1 s.
      - name: Syntax-check shell scripts
        run: |
          bash -n build_install.sh
          bash -n scripts/fetch_ocr_models.sh

      # ncnn is built from source through FetchContent on every clean runner
      # ("CPU-only, no Vulkan") and dominates the build time. ccache is
      # content-addressed, so it survives a fresh clone (a build-tree cache
      # would not: the checkout's mtimes are always newer than restored
      # objects) and repays its setup cost from the second run on.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 500M

      - name: Configure & build
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)
          ccache --show-stats --verbose | head -20

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Headless smoke: the first instance stays resident holding the
      # single-instance socket, the second forwards --translate-selection and
      # exits. Under offscreen the GlobalShortcutManager refuses registration
      # by design (logged, not fatal). QT_FORCE_STDERR_LOGGING keeps qDebug on
      # stderr so failures are visible in the Actions log.
      - name: Headless smoke test
        run: |
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_FORCE_STDERR_LOGGING=1
          # If the first instance died before creating the command socket, the
          # second would become the server itself and block forever — the
          # timeouts turn that into a fast, visible step failure instead.
          timeout 30 ./build/TransAI --background > /tmp/transai.out 2> /tmp/transai.err &
          APP_PID=$!
          sleep 5
          timeout 15 ./build/TransAI --translate-selection
          STATUS=$?
          # A QML error does not kill the process (the window is just broken or
          # empty), so "still running" is not enough: any QML runtime error in
          # the log fails the gate. Environment chatter such as the offscreen
          # plugin's "does not support raise()" is not matched on purpose.
          if grep -Eq 'is not defined|TypeError|ReferenceError|Unable to assign|Cannot assign|failed to load component|is not a type|qrc:/qml/.*\.qml:[0-9]+:' /tmp/transai.err; then
            echo "::error::QML runtime errors detected"
            cat /tmp/transai.err
            kill $APP_PID || true
            exit 1
          fi
          kill $APP_PID || true
          exit $STATUS

  # Memory/UB safety net: same sources and tests as linux, built with
  # AddressSanitizer + UndefinedBehaviorSanitizer. Leak detection is disabled
  # because Qt/ICU keep intentional global allocations alive at exit.
  sanitizers:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgl1-mesa-dev \
            libxkbcommon-dev libdbus-1-dev libsecret-1-dev p7zip-full

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          archives: qtbase qtdeclarative icu

      - name: Fetch bundled OCR models
        run: ./scripts/fetch_ocr_models.sh

      # Instrumented objects are large, so this job gets its own (bigger)
      # ccache: the sanitizer build dominated the job at ~14 min before.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 1500M

      - name: Configure & build with ASan + UBSan
        run: |
          cmake -B build-asan -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -D CMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j$(nproc)
          ccache --show-stats --verbose | head -20

      - name: Unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # Cross-platform coverage: build + unit tests only (no GUI smoke on
  # headless runners). Both jobs are blocking gates, like linux.
  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          arch: win64_mingw
          cache: true
          archives: qtbase qtdeclarative
          # Qt's prebuilt MinGW archives need the *matching* toolchain: the
          # runner's system gcc disagrees with them on how `__argc` is
          # declared, which surfaces as an undefined `__imp___argc` at link
          # time (Qt6EntryPoint references the dllimport flavour).
          tools: 'tools_mingw1310'

      # The job is a blocking gate, so the toolchain check fails fast instead of
      # warning: the runner's system gcc cannot link Qt's prebuilt MinGW
      # archives (`__imp___argc`), so a fallback would only turn a one-line
      # message into a confusing link error far away from its cause.
      - name: Require Qt's matching MinGW toolchain
        shell: pwsh
        run: |
          $qtRoot = Split-Path (Split-Path $env:QT_ROOT_DIR)
          # Version-agnostic lookup (`mingw1310_64` today, anything newer later)
          # so a Qt toolchain bump does not break this step for the wrong reason.
          $mingw = Get-ChildItem -Path (Join-Path $qtRoot 'Tools') -Directory -Filter 'mingw*_64' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'bin' } |
            Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } |
            Sort-Object -Descending |
            Select-Object -First 1
          if (-not $mingw) {
            throw "No Qt MinGW toolchain (Tools\mingw*_64\bin\gcc.exe) under $qtRoot; refusing to build with the runner's system gcc"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Qt MinGW toolchain: $mingw"
          gcc --version
          Write-Host "which gcc: $((Get-Command gcc).Source)"

      # 7-Zip ships with the windows-latest image; Git Bash resolves `7z` only
      # once its directory is on PATH.
      - name: Fetch bundled OCR models
        shell: bash
        run: |
          export PATH="/c/Program Files/7-Zip:$PATH"
          ./scripts/fetch_ocr_models.sh

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.job }}
          max-size: 500M

      - name: Configure & build
        run: |
          cmake -B build -G "MinGW Makefiles" -D CMAKE_BUILD_TYPE=Release `
            -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j4
          ccache --show-stats --verbose | Select-Object -First 20

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # QtTest output does not reach ctest's pipes on the Windows MinGW build
      # (empty "<end of output>" even for passing tests), so a failure there
      # arrives with no explanation. Re-run every test through QtTest's file
      # logger and print the captured text.
      - name: Diagnose failing tests
        if: failure()
        shell: pwsh
        run: |
          Write-Host '--- LastTest.log (tail) ---'
          if (Test-Path build\Testing\Temporary\LastTest.log) {
            Get-Content build\Testing\Temporary\LastTest.log -Tail 40
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_ASSUME_STDERR_HAS_CONSOLE = '1'
          foreach ($exe in Get-ChildItem build\tests\tst_*.exe) {
            $name = $exe.BaseName
            $out = Join-Path $env:RUNNER_TEMP "$name.txt"
            Write-Host "--- $name ---"
            & $exe.FullName -o "$out,txt" | Out-Null
            Write-Host "exit=$LASTEXITCODE"
            if (Test-Path $out) { Get-Content $out -Tail 60 }
          }
          Write-Host '--- Application event log (crashes) ---'
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting|Application Hang' } |
            Select-Object -First 6 TimeCreated, ProviderName, Message | Format-List

  macos:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          archives: qtbase qtdeclarative

      - name: Configure, build & test
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
          ctest --test-dir build --output-on-failure

  # Manual only (workflow_dispatch). Exercises the OCR guard in the Windows
  # packaging scripts, which the normal jobs never touch: a run without the
  # model files must stop instead of producing an archive whose OCR mode can
  # never work.
  #
  # No Qt or compiler is involved on purpose — `build\*` and the three MinGW
  # runtime DLLs are stubs and windeployqt is a no-op shim, so the job tests the
  # guard and the script plumbing, not Qt's deployment. Both .ps1 files are
  # parser-checked; windows-publish.ps1 (MSVC) cannot run here (it needs the VS
  # redist/WinSDK environment), but it shares scripts/ocr-models.ps1 with the
  # MinGW script, which is covered end to end.
  packaging-dryrun:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch bundled OCR models
        shell: bash
        run: |
          export PATH="/c/Program Files/7-Zip:$PATH"
          ./scripts/fetch_ocr_models.sh

      - name: Stub the build output, the Qt runtime and windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Content build\TransAI.exe 'stub'
          $qt = Join-Path $env:RUNNER_TEMP 'qtstub'
          New-Item -ItemType Directory -Force (Join-Path $qt 'bin') | Out-Null
          foreach ($dll in @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            Set-Content (Join-Path $qt "bin\$dll") 'stub'
          }
          $shim = Join-Path $env:RUNNER_TEMP 'shim'
          New-Item -ItemType Directory -Force $shim | Out-Null
          Set-Content (Join-Path $shim 'windeployqt.cmd') '@exit /b 0'
          $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "QTSTUB=$qt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Syntax-check the packaging scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "$($file.Name): $($errors[0].Message)" }
          }

      - name: Package with models (must succeed and ship the models)
        shell: pwsh
        run: |
          ./scripts/windows-mingw-publish.ps1 -archiveName pkg-ok -targetName TransAI -Qt6_DIR $env:QTSTUB
          if (-not (Test-Path pkg-ok.zip)) { throw 'pkg-ok.zip was not produced' }
          Expand-Archive pkg-ok.zip -DestinationPath expanded-ok -Force
          foreach ($rel in @('pkg-ok\TransAI.exe', 'pkg-ok\ocr\models\ch_PP-OCRv3_det_infer.bin',
                             'pkg-ok\ocr\models\ch_PP-OCRv3_rec_infer.bin', 'pkg-ok\ocr\models\ppocr_keys_v1.txt')) {
            if (-not (Test-Path (Join-Path expanded-ok $rel))) { throw "$rel missing from the archive" }
          }

      - name: Package without models (must abort)
        shell: pwsh
        run: |
          Move-Item res\ocr\models res\ocr\models.bak
          try {
            $failed = $false
            try {
              ./scripts/windows-mingw-publish.ps1 -archiveName pkg-broken -targetName TransAI -Qt6_DIR $env:QTSTUB
            } catch {
              $failed = $true
              Write-Host "refused as expected: $($_.Exception.Message)"
              if ($_.Exception.Message -notmatch 'is incomplete') { throw 'unexpected error text' }
            }
            if (-not $failed) { throw 'packaging succeeded without the OCR models' }
            if (Test-Path pkg-broken.zip) { throw 'an archive was produced despite the missing models' }
          } finally {
            Move-Item res\ocr\models.bak res\ocr\models
          }
