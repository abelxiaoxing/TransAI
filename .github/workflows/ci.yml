name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgl1-mesa-dev \
            libxkbcommon-dev libdbus-1-dev libsecret-1-dev p7zip-full

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          # Explicit archive list: qtbase covers Core/Network/DBus/Test,
          # qtdeclarative covers Quick/QML, icu holds the bundled
          # libicui18n/libicuuc/libicudata that the prebuilt Qt binaries link
          # against (Ubuntu 24.04 ships ICU 74, Qt 6.9 wants .73).
          archives: qtbase qtdeclarative icu

      # The bundled OCR backend needs its PP-OCR weights; they are not in git
      # (13 MB of binaries). Without them the end-to-end OCR test skips itself.
      - name: Fetch bundled OCR models
        run: ./scripts/fetch_ocr_models.sh

      # The first configure builds ncnn through FetchContent (CPU-only, no
      # Vulkan); ~5-7 min on a fresh cache.
      - name: Configure & build
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Headless smoke: the first instance stays resident holding the
      # single-instance socket, the second forwards --translate-selection and
      # exits. Under offscreen the GlobalShortcutManager refuses registration
      # by design (logged, not fatal). QT_FORCE_STDERR_LOGGING keeps qDebug on
      # stderr so failures are visible in the Actions log.
      - name: Headless smoke test
        run: |
          export QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QT_FORCE_STDERR_LOGGING=1
          # If the first instance died before creating the command socket, the
          # second would become the server itself and block forever — the
          # timeouts turn that into a fast, visible step failure instead.
          timeout 30 ./build/TransAI --background > /tmp/transai.out 2> /tmp/transai.err &
          APP_PID=$!
          sleep 5
          timeout 15 ./build/TransAI --translate-selection
          STATUS=$?
          # A QML error does not kill the process (the window is just broken or
          # empty), so "still running" is not enough: any QML runtime error in
          # the log fails the gate. Environment chatter such as the offscreen
          # plugin's "does not support raise()" is not matched on purpose.
          if grep -Eq 'is not defined|TypeError|ReferenceError|Unable to assign|Cannot assign|failed to load component|is not a type|qrc:/qml/.*\.qml:[0-9]+:' /tmp/transai.err; then
            echo "::error::QML runtime errors detected"
            cat /tmp/transai.err
            kill $APP_PID || true
            exit 1
          fi
          kill $APP_PID || true
          exit $STATUS

  # Memory/UB safety net: same sources and tests as linux, built with
  # AddressSanitizer + UndefinedBehaviorSanitizer. Leak detection is disabled
  # because Qt/ICU keep intentional global allocations alive at exit.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libgl1-mesa-dev \
            libxkbcommon-dev libdbus-1-dev libsecret-1-dev p7zip-full

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          archives: qtbase qtdeclarative icu

      - name: Fetch bundled OCR models
        run: ./scripts/fetch_ocr_models.sh

      - name: Configure & build with ASan + UBSan
        run: |
          cmake -B build-asan -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -D CMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j$(nproc)

      - name: Unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # Cross-platform coverage: build + unit tests only (no GUI smoke on
  # headless runners). Both jobs are blocking gates, like linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          arch: win64_mingw
          cache: true
          archives: qtbase qtdeclarative
          # Qt's prebuilt MinGW archives need the *matching* toolchain: the
          # runner's system gcc disagrees with them on how `__argc` is
          # declared, which surfaces as an undefined `__imp___argc` at link
          # time (Qt6EntryPoint references the dllimport flavour).
          tools: 'tools_mingw1310'

      # The job is a blocking gate, so the toolchain check fails fast instead of
      # warning: the runner's system gcc cannot link Qt's prebuilt MinGW
      # archives (`__imp___argc`), so a fallback would only turn a one-line
      # message into a confusing link error far away from its cause.
      - name: Require Qt's matching MinGW toolchain
        shell: pwsh
        run: |
          $qtRoot = Split-Path (Split-Path $env:QT_ROOT_DIR)
          # Version-agnostic lookup (`mingw1310_64` today, anything newer later)
          # so a Qt toolchain bump does not break this step for the wrong reason.
          $mingw = Get-ChildItem -Path (Join-Path $qtRoot 'Tools') -Directory -Filter 'mingw*_64' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'bin' } |
            Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } |
            Sort-Object -Descending |
            Select-Object -First 1
          if (-not $mingw) {
            throw "No Qt MinGW toolchain (Tools\mingw*_64\bin\gcc.exe) under $qtRoot; refusing to build with the runner's system gcc"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using Qt MinGW toolchain: $mingw"
          gcc --version
          Write-Host "which gcc: $((Get-Command gcc).Source)"

      # 7-Zip ships with the windows-latest image; Git Bash resolves `7z` only
      # once its directory is on PATH.
      - name: Fetch bundled OCR models
        shell: bash
        run: |
          export PATH="/c/Program Files/7-Zip:$PATH"
          ./scripts/fetch_ocr_models.sh

      - name: Configure & build
        run: |
          cmake -B build -G "MinGW Makefiles" -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # On Windows a test process can die before QTest prints anything, leaving
      # ctest with an empty failure report. Dump the per-test log, the platform
      # plugins, direct runs and the crash events from the Application log.
      - name: Diagnose failing tests
        if: failure()
        shell: pwsh
        run: |
          Write-Host '--- LastTest.log (tail) ---'
          if (Test-Path build\Testing\Temporary\LastTest.log) {
            Get-Content build\Testing\Temporary\LastTest.log -Tail 300
          }
          Write-Host '--- platform plugins ---'
          Get-ChildItem "$env:QT_ROOT_DIR\plugins\platforms" -ErrorAction SilentlyContinue
          foreach ($t in @('tst_rapidocr','tst_ocrengine','tst_applicationcommandserver','tst_windowdismiss')) {
            Write-Host "--- direct run: $t ---"
            $env:QT_QPA_PLATFORM = 'offscreen'
            & "build\tests\$t.exe" 2>&1 | Select-Object -First 40
            Write-Host "exit=$LASTEXITCODE"
          }
          Write-Host '--- Application event log (crashes) ---'
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting|Application Hang' } |
            Select-Object -First 6 TimeCreated, ProviderName, Message | Format-List

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          cache: true
          archives: qtbase qtdeclarative

      - name: Configure, build & test
        run: |
          cmake -B build -D CMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
          ctest --test-dir build --output-on-failure
